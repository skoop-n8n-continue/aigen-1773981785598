<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skoop Signage Menu</title>

    <!-- Caching & Cache Busting Requirements -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="styles.css?v=10f8f9">
</head>
<body>
    <div id="app">
        <!-- Main menu content will go here -->
        <div id="menu-container" class="menu-container">
            <div id="scroll-content" class="scroll-content">
                <!-- Injected via script.js -->
            </div>
        </div>
    </div>

    <!-- Script with cache busting -->
    <script src="script.js?v=10f8f9"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
